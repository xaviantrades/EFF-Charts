<!DOCTYPE html>
<!--
=====================================================================
  KILELE TRADER  -  mobile trading app UI (single file, no React)
=====================================================================
  This is a "JS-heavy, HTML-light" app:
    - The HTML below is almost empty: just one <div id="app">.
    - Every page (Quotes, Charts, Trade, History, Messages, Settings...)
      is a small JS object that has a render() function returning HTML.
    - A tiny router swaps pages when the URL hash changes (#/quotes).

  THE 6 IDEAS TO UNDERSTAND (read in this order):
    1. STATE      -> one object holding all data (account, settings...)
    2. FEED       -> a fake price engine ticking every second
    3. PAGES      -> objects: { header(), render(), mount(), unmount() }
    4. ROUTER     -> reads location.hash and shows the matching page
    5. ACTIONS    -> any element with data-action="name" calls Actions.name()
    6. UI helpers -> bottom sheets, dialogs, toasts, drawer

  HOW TO ADD A NEW PAGE (3 steps):
    a) Add an object to PAGES  (copy the "about" page, it's the simplest)
    b) Link to it:  <button data-action="go" data-to="mypage">
    c) Done. No other wiring needed.

  PRICES ARE SIMULATED. To use a real feed, replace the tick() function
  in section 2 (search for "REAL FEED").

  The look is inspired by classic mobile trading terminals, but all code,
  icons and names here are original placeholders. Use Ctrl+F "EDIT" to
  find things to customise (brand name, texts, symbols).
=====================================================================
-->
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover lets the app use the full screen on notched phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Kilele Trader</title> <!-- EDIT: brand name -->

  <!-- Fonts: Roboto (body) + Roboto Condensed (titles and numbers) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">

  <!-- Chart library (free, open source, by TradingView). Needs internet. -->
  <script src="https://unpkg.com/lightweight-charts@5/dist/lightweight-charts.standalone.production.js"></script>

  <style>
    /* ===============================================================
       1) THEME COLOURS
       Every colour in the app is a CSS variable. The <html> tag has
       data-theme="dark" or "light" and the matching block below applies.
       Changing the theme = changing that one attribute (see applyTheme()).
       =============================================================== */
    :root { --font: 'Roboto', system-ui, sans-serif; --cond: 'Roboto Condensed', 'Roboto', sans-serif; }

    :root[data-theme="dark"] {
      --outer:#0a0a0a;   /* page background around the phone column on desktop */
      --bg:#000;         /* app background */
      --surface:#2b2c2f; /* dialogs and bottom sheets */
      --text:#fff;       /* main text */
      --muted:#8f959c;   /* secondary text */
      --line:#2c2d30;    /* thin dividers */
      --accent:#3385ff;  /* blue buttons and active tab */
      --up:#4d8ff5;      /* price going up / buy (blue) */
      --dn:#ef5350;      /* price going down / sell (red) */
      --cup:#26a69a;     /* chart candle: up */
      --cdn:#ef5350;     /* chart candle: down */
      --grid:rgba(255,255,255,.09);
      --pill:#2b2e34;    /* small grey pills */
      --btn2:#272b32;    /* secondary button */
      --dots:#55585d;    /* dotted leader lines */
    }
    :root[data-theme="light"] {
      --outer:#e9ecef; --bg:#fff; --surface:#f2f4f7; --text:#14171a; --muted:#6a7077;
      --line:#e2e5e9; --accent:#1f6df2; --up:#1f6df2; --dn:#d8372f;
      --cup:#1c9a8c; --cdn:#d8372f; --grid:rgba(0,0,0,.09);
      --pill:#e8ecf1; --btn2:#e8ecf1; --dots:#b4b9bf;
    }

    /* ===============================================================
       2) BASE + APP SHELL
       The app is a column: header on top, scrolling main, nav at bottom.
       On desktop it becomes a centred phone-width column.
       =============================================================== */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: var(--font); background: var(--outer); color: var(--text); }
    button { font-family: inherit; cursor: pointer; }
    input, select { font-family: inherit; font-size: 16px; } /* 16px stops iOS zooming on focus */
    .up { color: var(--up); } .dn { color: var(--dn); } .muted { color: var(--muted); }

    #app {
      display: flex; flex-direction: column;
      height: 100dvh; max-width: 480px; margin: 0 auto;
      background: var(--bg); position: relative; overflow: hidden;
    }

    /* ---- Header ---- */
    #hdr { flex: none; height: 60px; display: flex; align-items: center; padding: 0 6px; gap: 2px; }
    .hbtn { width: 44px; height: 44px; border: 0; background: none; color: var(--text);
            display: grid; place-items: center; border-radius: 50%; }
    .hbtn.txt { width: auto; padding: 0 12px; font-family: var(--cond); font-size: 20px; border-radius: 10px; }
    .title { flex: 1; font-family: var(--cond); font-size: 24px; padding-left: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .title.two small { display: block; font-size: 16px; line-height: 1.1; }
    .title.two span { color: var(--muted); }
    .actions { display: flex; }

    /* ---- Main scrolling area ---- */
    #main { flex: 1; overflow-y: auto; position: relative; }

    /* ---- Bottom navigation ---- */
    #nav { flex: none; display: flex; height: calc(72px + env(safe-area-inset-bottom));
           padding-bottom: env(safe-area-inset-bottom); background: var(--bg); }
    .nav-item { flex: 1; border: 0; background: none; color: var(--text);
                display: flex; flex-direction: column; align-items: center; justify-content: center;
                gap: 4px; font-size: 14px; font-weight: 500; }
    .nav-item.active { color: var(--accent); }
    .pill { background: var(--pill); color: var(--text); padding: 2px 12px; border-radius: 12px; font-size: 14px; }
    .nav-item.active .pill { color: var(--accent); }

    /* ===============================================================
       3) SHARED COMPONENTS
       =============================================================== */
    .btn { border: 0; border-radius: 999px; background: var(--accent); color: #fff;
           font-weight: 700; font-size: 15px; padding: 14px 24px; letter-spacing: .3px; text-transform: uppercase; }
    .btn.sec { background: var(--btn2); color: var(--accent); }
    .btn.block { width: 100%; }
    .btn.plain { text-transform: none; font-weight: 500; }

    .empty { display: flex; flex-direction: column; align-items: center; justify-content: center;
             gap: 14px; padding: 40px 24px; min-height: 60%; text-align: center; color: var(--muted); }
    .circle-plus { width: 78px; height: 78px; border: 2px solid var(--accent); border-radius: 50%;
                   display: grid; place-items: center; color: var(--accent); }
    .empty p { color: var(--text); }

    /* dotted-leader rows: "Balance: ........ 100 000.00" */
    .dr { display: flex; align-items: baseline; padding: 4px 16px; font-size: 16px; }
    .dr b { font-weight: 700; }
    .dr i { flex: 1; border-bottom: 3px dotted var(--dots); margin: 0 8px; transform: translateY(-3px); }
    .dr span { font-family: var(--cond); font-weight: 700; font-size: 17px; }
    .summary { padding: 10px 0; border-bottom: 1px solid var(--line); }

    .section { padding: 18px 18px 6px; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .6px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px;
           padding: 16px 18px; border: 0; border-bottom: 1px solid var(--line);
           background: none; color: var(--text); width: 100%; text-align: left; font-size: 16px; }
    .row small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }

    /* toggle switch */
    .switch { width: 48px; height: 28px; border-radius: 14px; border: 0; background: var(--pill); position: relative; flex: none; }
    .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
                     background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
    .switch.on { background: var(--accent); }
    .switch.on::after { transform: translateX(20px); }

    /* segmented control (theme picker) */
    .seg { display: flex; background: var(--pill); border-radius: 10px; padding: 3px; }
    .seg button { border: 0; background: none; color: var(--text); padding: 7px 12px; border-radius: 8px; font-size: 14px; }
    .seg button.on { background: var(--accent); color: #fff; }

    /* ===============================================================
       4) QUOTES PAGE
       =============================================================== */
    .q-row { display: flex; justify-content: space-between; padding: 12px 18px; }
    .q-row:active { background: var(--pill); }
    .q-chg { font-size: 14px; }
    .q-sym { font-family: var(--cond); font-weight: 700; font-size: 20px; margin: 1px 0; }
    .q-meta { display: flex; align-items: center; gap: 6px; color: var(--muted); font-family: var(--cond); font-size: 15px; }
    .q-right { text-align: right; }
    .q-prices { display: flex; gap: 14px; justify-content: flex-end; font-family: var(--cond); line-height: 1.1; }
    .px { font-weight: 400; }
    .px.up { color: var(--up); } .px.dn { color: var(--dn); }
    .px .pre { font-size: 25px; } .px .big { font-size: 33px; }
    .px sup { font-size: 15px; vertical-align: top; position: relative; top: 2px; }
    .q-lh { color: var(--muted); font-family: var(--cond); font-size: 15px; display: flex; gap: 14px; justify-content: flex-end; }

    /* ===============================================================
       5) CHART PAGE
       =============================================================== */
    .chart-wrap { position: absolute; inset: 0; }
    #chart { position: absolute; inset: 0; }
    .chart-label { position: absolute; top: 6px; left: 8px; z-index: 5; text-align: left; border: 0;
                   background: none; color: var(--text); font-size: 16px; line-height: 1.3; }
    .chart-label b { color: var(--accent); font-weight: 500; }
    .chart-label span { color: var(--muted); }

    /* ===============================================================
       6) TRADE + HISTORY PAGES
       =============================================================== */
    .pos { display: flex; justify-content: space-between; padding: 12px 18px; border-bottom: 1px solid var(--line); }
    .pos:active { background: var(--pill); }
    .pos b { font-family: var(--cond); font-size: 19px; }
    .pos .pos-r { font-family: var(--cond); font-weight: 700; font-size: 20px; align-self: center; }
    .pos .sub { font-family: var(--cond); font-size: 15px; color: var(--muted); }

    .tabs { display: flex; border-bottom: 1px solid var(--line); }
    .tab { flex: 1; text-align: center; padding: 14px 0; border: 0; background: none; color: var(--muted);
           font-size: 15px; letter-spacing: .5px; text-transform: uppercase; border-bottom: 3px solid transparent; margin-bottom: -1px; }
    .tab.on { color: var(--text); border-bottom-color: var(--accent); }

    .deal { display: flex; justify-content: space-between; padding: 10px 18px; border-bottom: 1px solid var(--line); }
    .deal b { font-family: var(--cond); font-size: 19px; }
    .deal .r { text-align: right; font-family: var(--cond); color: var(--muted); font-size: 15px; }
    .deal .r div:last-child { font-weight: 700; font-size: 16px; }

    /* ===============================================================
       7) LOGIN PAGE
       =============================================================== */
    .opt { display: flex; align-items: center; gap: 16px; padding: 18px; border: 0; width: 100%;
           background: none; color: var(--text); text-align: left; border-bottom: 1px solid var(--line); }
    .opt.off { opacity: .4; pointer-events: none; }
    .opt-ic { width: 54px; height: 54px; border-radius: 50%; background: linear-gradient(#2f9bff,#2f6cff); color: #fff; display: grid; place-items: center; flex: none; }
    .opt h4 { font-weight: 500; font-size: 20px; font-family: var(--cond); }
    .opt p { color: var(--muted); font-size: 15px; }
    .field { display: flex; align-items: center; justify-content: space-between; margin: 0 18px;
             padding: 18px 0; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 17px; }
    .field input, .field select { background: none; border: 0; outline: 0; color: var(--text); text-align: right; flex: 1; min-width: 0; font-size: 17px; }
    .field select option { color: #000; }
    .field input[type=checkbox] { flex: none; width: 24px; height: 24px; accent-color: var(--accent); }
    .link { color: var(--accent); text-align: center; padding: 20px; display: block; border: 0; background: none; width: 100%; font-size: 16px; }

    /* ===============================================================
       8) DRAWER (side menu)
       =============================================================== */
    #drawer { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
    #drawer .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.55); opacity: 0; transition: opacity .25s; }
    #drawer .panel { position: absolute; left: 0; top: 0; bottom: 0; width: 84%; max-width: 340px; overflow-y: auto;
                     background: var(--bg); border-right: 1px solid var(--line); transform: translateX(-100%); transition: transform .25s; }
    #drawer.open { pointer-events: auto; }
    #drawer.open .scrim { opacity: 1; }
    #drawer.open .panel { transform: none; }
    .d-head { position: relative; overflow: hidden; padding: 24px 20px 18px; border-bottom: 1px solid var(--line); }
    .d-user { display: flex; gap: 16px; align-items: center; }
    .logo { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg,#0b403b,#062e2b); display: grid; place-items: center; color: #f5a524; flex: none; }
    .d-user small { color: var(--muted); display: block; margin-top: 2px; }
    .ribbon { position: absolute; top: 16px; right: -38px; width: 130px; transform: rotate(45deg); background: #3bb91c; color: #fff; text-align: center; font-size: 13px; padding: 4px 0; }
    .d-item { display: flex; align-items: center; gap: 24px; width: 100%; border: 0; background: none; color: var(--text);
              padding: 16px 20px; font-size: 17px; font-weight: 500; text-align: left; }
    .d-item .badge { margin-left: auto; background: #ef4444; color: #fff; border-radius: 12px; font-size: 12px; padding: 3px 8px; }

    /* ===============================================================
       9) SHEETS, DIALOGS, TOAST
       =============================================================== */
    #overlay { position: absolute; inset: 0; z-index: 40; display: none; }
    #overlay.open { display: block; }
    #overlay .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.6); }
    .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 18px 18px 0 0;
             padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); animation: up .2s ease-out; max-height: 85%; overflow-y: auto; }
    .modal { position: absolute; left: 14px; right: 14px; top: 50%; transform: translateY(-50%); background: var(--surface);
             border-radius: 16px; border: 1px solid var(--line); padding: 22px 20px; max-height: 90%; overflow-y: auto; }
    .modal h3, .sheet h3 { text-align: center; font-size: 22px; font-weight: 700; padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--line); font-family: var(--cond); }
    .modal p { font-size: 15px; line-height: 1.4; margin-bottom: 12px; }
    .modal .btns { display: flex; gap: 12px; margin: 16px 0; }
    .modal .btns .btn { flex: 1; text-transform: none; font-weight: 500; }
    .modal .btn.out { background: none; border: 1px solid var(--accent); color: var(--accent); }
    @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
    .item { display: flex; align-items: center; justify-content: space-between; width: 100%; border: 0; background: none;
            color: var(--text); padding: 15px 4px; font-size: 17px; border-bottom: 1px solid var(--line); text-align: left; }
    .item:last-child { border-bottom: 0; }

    /* order sheet */
    .o-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; }
    .o-row select, .o-row input { background: var(--pill); color: var(--text); border: 0; border-radius: 10px; padding: 12px; font-size: 18px; text-align: center; }
    .stepper { display: flex; gap: 8px; align-items: center; }
    .stepper input { width: 110px; }
    .stepper button { width: 44px; height: 44px; border-radius: 10px; border: 0; background: var(--pill); color: var(--text); font-size: 22px; }
    .trade-btns { display: flex; gap: 12px; margin-top: 14px; }
    .tb { flex: 1; border: 0; border-radius: 12px; padding: 12px 6px; color: #fff; font-family: var(--cond); }
    .tb small { display: block; font-size: 14px; letter-spacing: 1px; opacity: .9; }
    .tb span { font-size: 26px; font-weight: 700; }
    .tb.sell { background: var(--dn); } .tb.buy { background: #2f6cff; }

    #toast { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 60; background: #333; color: #fff;
             padding: 10px 18px; border-radius: 20px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 86%; text-align: center; }
    #toast.show { opacity: 1; }

    .news { padding: 14px 18px; border-bottom: 1px solid var(--line); }
    .news small { color: var(--muted); }
    .log { padding: 8px 18px; font-size: 14px; border-bottom: 1px solid var(--line); }
    .log small { color: var(--muted); display: block; font-family: var(--cond); }

    /* respect people who turn animations off */
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>

<body>
  <!-- The ONLY real HTML. Everything else is created by JavaScript below. -->
  <div id="app"></div>

  <script src="js/01-core.js"></script>
  <script src="js/02-pages-base.js"></script>
  <script src="js/03-pages-market.js"></script>
  <script src="js/04-pages-trading.js"></script>
  <script src="js/05-pages-other.js"></script>
  <script src="js/06-actions.js"></script>
  <script src="js/07-router-startup.js"></script>

</body>
</html>
